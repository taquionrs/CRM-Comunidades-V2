    <div class="sub" style="margin-top:8px">I3 sale de las fechas de las listas de miembros que se cargan a mano. Si una lista no trae fecha de ingreso, se usa el día de la carga. Las entradas y los clics pueden incluir personas que no llegaron por la pauta. "Entradas ÷ conversaciones" puede pasar de 100 %: muestra cuánto del tráfico del flow no viene de las conversaciones de Meta.</div></div>`;

  const motor = `<div class="card"><h3>Los cuatro números del motor</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Número</th><th>Valor hoy</th><th>Estado</th></tr></thead><tbody>
      <tr><td><b>Tasa de triaje</b> (meta &gt; 50 %)</td><td>${pctTxt(tot.tasa_triaje)} <span class="sub" style="margin:0">(I3 ÷ I1)</span></td><td>Se mide por comunidad, abajo. Depende de cargar las listas de miembros.</td></tr>
      <tr><td><b>CPME</b> (costo por miembro efectivo)</td><td>${cpme == null ? '—' : fmtMoney(cpme)}</td><td>Se mide: inversión ÷ (MF − MI). Cuenta el crecimiento desde la lista de partida (14/10).</td></tr>
      <tr><td><b>CPMR</b> (costo por miembro que se queda)</td><td>—</td><td>Sin fuente: necesita los pulsos de retención de ManyChat (a los 7 y 30 días).</td></tr>
      <tr><td><b>TRG por grupo</b> <span class="hint" title="Definición propuesta a confirmar: miembros que siguen ÷ (miembros que siguen + bajas), por grupo, nunca promediado.">ⓘ</span></td>
          <td>${(comunidadesRango || []).filter(c => trgGrupo(c) != null).map(c => `${esc(c.nombre)}: ${fmtPct(trgGrupo(c))}`).join(' · ') || '—'}${trgTotal(comunidadesRango) != null ? `<div class="sub" style="margin:2px 0 0">Total del cliente: ${fmtPct(trgTotal(comunidadesRango))}</div>` : ''}</td>
          <td>Definición propuesta, por confirmar. Se calcula desde la segunda carga de lista completa.</td></tr>
      <tr><td><b>K-Factor</b> (cuántos miembros trae cada miembro)</td><td>—</td><td>Sin fuente ni definición: necesita saber quién invitó a quién (enlace único por miembro).</td></tr>
    </tbody></table></div></div>`;

  const lista = (registros || []).map(r => `<tr><td class="mono">${esc(fmtDia(r.fecha))}</td><td>${esc(r.tarea)}</td><td class="num">${fmtInt(r.minutos)} min</td><td>${esc(r.nota || '')}</td><td>${esc(r.por || '')}</td>
      <td><button class="btn btn-mini" type="button" data-hm-borrar="${esc(r.id)}" aria-label="Borrar este registro">Borrar</button></td></tr>`).join('');
  const horas = `<div class="card"><h3>Horas de carga manual</h3>
    <div class="sub">Registrá cada tarea que hacés a mano (cargar conteos, importar datos, limpiar pruebas…). Con ${DIAS_LINEA_BASE} días hábiles de registro queda la <b>línea de base</b>; sin ella no hay claim de horas eliminadas. En este período: <b>${h.texto}</b> en ${h.dias} ${h.dias === 1 ? 'día' : 'días'}${h.completa ? ' — línea de base completa.' : `, faltan ${h.faltan}.`}</div>
    ${(d.horas_manuales && d.horas_manuales.por_tarea || []).length ? `<div class="sub">${(d.horas_manuales.por_tarea).map(t => `${esc(t.tarea)}: ${formatoMinutos(t.minutos)}`).join(' · ')}</div>` : ''}
    <div class="filters" style="margin:10px 0">
      <label>Fecha<input type="date" id="hmFecha" value="${esc(hoyAR())}"></label>
      <label>Tarea<input type="text" id="hmTarea" list="hmTareas" placeholder="Qué hiciste a mano" style="min-width:260px"><datalist id="hmTareas">${TAREAS_MANUALES.map(t => `<option value="${esc(t)}">`).join('')}</datalist></label>
      <label>Minutos<input type="number" id="hmMin" min="1" max="720" value="15" style="width:90px"></label>
      <label>Nota (opcional)<input type="text" id="hmNota" maxlength="500" style="min-width:200px"></label>
      <button class="btn" id="hmGuardar" type="button">Registrar</button>
    </div>
    <div class="sub" id="hmEstado" role="status" style="margin:0 0 8px"></div>
    <div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Tarea</th><th class="num">Tiempo</th><th>Nota</th><th>Registró</th><th></th></tr></thead><tbody>${lista || '<tr class="empty-row"><td colspan="6">Todavía no hay registros. Empezá hoy.</td></tr>'}</tbody></table></div></div>`;

  const chequeos = `<div class="card"><h3>Chequeos de integridad de las métricas</h3>
    <div class="sub">${ch.avisos ? `<span style="color:var(--warn)">${ch.avisos} de ${ch.total} chequeos con aviso.</span>` : `Los ${ch.total} chequeos están en orden.`} Cada uno compara una métrica con la fuente de la que sale: si algo no cierra, se ve acá antes de que llegue a un reporte.</div>
    <div class="tbl-wrap"><table><thead><tr><th>Chequeo</th><th>Estado</th><th>Detalle</th></tr></thead><tbody>${(d.chequeos || []).map(x => `<tr><td>${esc(x.titulo)}</td><td><span class="pill ${x.estado === 'ok' ? 'pill-ok' : 'badge-warn'}">${x.estado === 'ok' ? 'En orden' : 'Aviso'}</span></td><td>${esc(x.detalle)}</td></tr>`).join('')}</tbody></table></div></div>`;

  return barra + tarjetas + triaje + motor + horas + chequeos;
}
function wireObjetivos(){
  wireFiltrosPeriodo();
  const estado = (t, error) => { const el = document.getElementById('hmEstado'); if (el) { el.textContent = t; el.style.color = error ? 'var(--danger)' : ''; } };
  const guardar = document.getElementById('hmGuardar');
  if (guardar) guardar.onclick = async () => {
    const fecha = document.getElementById('hmFecha').value, tarea = document.getElementById('hmTarea').value.trim();
    const minutos = Number(document.getElementById('hmMin').value), nota = document.getElementById('hmNota').value.trim();
    if (!fecha) return estado('Elegí la fecha.', true);
    if (tarea.length < 3) return estado('Escribí qué hiciste (mínimo 3 letras).', true);
    if (!Number.isInteger(minutos) || minutos < 1 || minutos > 720) return estado('Los minutos tienen que ser un número entre 1 y 720.', true);
    guardar.disabled = true; estado('Guardando…');
    const { error } = await supabase.from('registro_horas_manuales').insert({ fecha, tarea, minutos, nota: nota || null });
    guardar.disabled = false;
    if (error) return estado('No se pudo guardar: ' + error.message, true);
    renderAll();
  };
  document.querySelectorAll('[data-hm-borrar]').forEach(b => {
    b.onclick = async () => {
      if (!confirm('¿Borrar este registro?')) return;
      b.disabled = true;
      const { error } = await supabase.from('registro_horas_manuales').delete().eq('id', b.dataset.hmBorrar);
      if (error) { b.disabled = false; return estado('No se pudo borrar: ' + error.message, true); }
      renderAll();
    };
  });
}

      <form id="formUsuario" class="form-row" style="margin-top:10px">
        <label>Email<input type="email" name="email" required placeholder="nombre@taquion.com.ar" style="width:260px"></label>
        <label>Rol<select name="rol">${opcionesRol('general')}</select></label>
        <label class="check"><input type="checkbox" name="admin"> Administrador</label>
        <button type="submit" class="btn" style="background:var(--accent); border-color:var(--accent); color:#fff">Dar de alta</button>

      <div class="sub">Nadie puede cambiar ni quitar su propio acceso. Los administradores fijos solo se cambian por SQL.</div>
      <div class="tbl-wrap"><table><thead><tr><th>Email</th><th>Rol</th><th>Admin</th><th>Última modificación</th><th></th></tr></thead><tbody>${filas || '<tr class="empty-row"><td colspan="5">Sin usuarios</td></tr>'}</tbody></table></div>

function wireUsuarios(){
  // Se busca el elemento cada vez: después de guardar, la pestaña se vuelve a dibujar.
  const avisar = (texto, error) => {
    const r = document.getElementById('usuarioResultado');
    if (r) { r.textContent = texto; r.style.color = error ? 'var(--danger)' : '#5fd39a'; }
  };
  const guardar = async (email, rol, admin) => {
    const { error } = await supabase.rpc('guardar_usuario_crm', { p_email: email, p_rol: rol, p_admin: admin });
    if (error) throw error;
  };
  const form = document.getElementById('formUsuario');
  if (form) form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const email = String(fd.get('email') || '').trim().toLowerCase();
    try {
      await guardar(email, fd.get('rol'), fd.get('admin') === 'on');
      await renderAll();
      avisar(`${email} quedó dado de alta.`);
    } catch (err) { avisar(err.message, true); }
  };
  document.querySelectorAll('#content tr[data-email]').forEach(tr => {
    const email = tr.dataset.email;
    const g = tr.querySelector('.usr-guardar');
    if (g) g.onclick = async () => {
      g.disabled = true;
      try { await guardar(email, tr.querySelector('.usr-rol').value, tr.querySelector('.usr-admin').checked); await renderAll(); avisar(`Se guardó el acceso de ${email}.`); }
      catch (err) { g.disabled = false; avisar(err.message, true); }
    };
    const q = tr.querySelector('.usr-quitar');
    if (q) q.onclick = async () => {
      if (!confirm(`¿Quitar el acceso de ${email} al CRM?`)) return;
      q.disabled = true;
      try {
        const { error } = await supabase.rpc('quitar_usuario_crm', { p_email: email });
        if (error) throw error;
        await renderAll(); avisar(`${email} ya no tiene acceso.`);
      } catch (err) { q.disabled = false; avisar(err.message, true); }
    };
  });
}

async function renderAll(){
  clearInterval(crudoTimer);
  if (!(await accesoVigente())) return;
  if (!tabsVisibles().some(t => t.key === state.tab)) state.tab = 'overview';
  renderNav();
  document.getElementById('hTitle').textContent = tabsVisibles().find(t => t.key===state.tab).label;
  document.getElementById('hSub').textContent = TAB_SUB[state.tab];
  const content = document.getElementById('content');
  content.innerHTML = '<div class="card"><h3>Cargando…</h3></div>';

  if (state.tab === 'usuarios') {
    try {
      const { data, error } = await supabase.rpc('usuarios_crm');
      if (error) throw error;
      content.innerHTML = renderUsuarios(data);
      wireUsuarios();
    } catch (err) {
      content.innerHTML = `<div class="card"><h3>No se pudieron cargar los usuarios</h3><div class="sub" style="color:var(--danger)">${esc(err.message)}</div></div>`;
    }
    return;
  }

  if (!state.clienteId) {
    content.innerHTML = '<div class="card"><h3>Sin clientes cargados</h3><div class="sub">Dar de alta al menos un cliente en crm_comunidades_v2.cliente — ver docs/how-to/agregar-un-cliente.md.</div></div>';
    return;
  }

  try {
    if (state.tab === 'overview') {
      // Overview usa las mismas filas que Control_Comunidades para el período elegido; los totales se calculan con ellas.
      const [todas, global] = await Promise.all([
        loadComunidadesRango(state.fechaDesde || null, state.fechaHasta || null, 'todos'),
        loadGlobalCliente(state.fechaDesde || null, state.fechaHasta || null),
      ]);
      const visibles = state.filtroComunidad ? todas.filter(c => c.id === state.filtroComunidad) : todas;
      // Los KPIs incluyen el gasto de las campañas globales (es del cliente); la tabla de comunidades no tiene esa fila.
      const paraKpis = global && !state.filtroComunidad ? [...visibles, global] : visibles;
      content.innerHTML = renderOverview(kpisDesdeComunidades(paraKpis), visibles, { todas, comunidad: state.filtroComunidad || '', desde: state.fechaDesde || '', hasta: state.fechaHasta || '' });
      wireFiltrosPeriodo();
      wireComunidadesForm();

    } else if (state.tab === 'control') {
      const [comunidadesRango, desglose, global] = await Promise.all([
        loadComunidadesRango(state.fechaDesde || null, state.fechaHasta || null, state.canalControl),
        esMarketing() ? loadDesgloseCampanas(state.fechaDesde || null, state.fechaHasta || null, state.filtroComunidad || null) : Promise.resolve(null),
        loadGlobalCliente(state.fechaDesde || null, state.fechaHasta || null),
      ]);
      // La fila de campañas globales va al final y suma en el total del cliente; con una comunidad elegida no aparece (no es de esa comunidad).
      const comunidades = global && state.canalControl === 'todos' ? [...comunidadesRango, global] : comunidadesRango;
      content.innerHTML = renderControl(comunidades, state.filtroComunidad || null, state.fechaDesde || '', state.fechaHasta || '', state.canalControl, desglose);
      wireControl();

    } else if (state.tab === 'objetivos') {
      const [datos, rango, registros, global] = await Promise.all([
        loadObjetivos(state.fechaDesde, state.fechaHasta),
        loadComunidadesRango(state.fechaDesde || null, state.fechaHasta || null, 'todos').catch(() => []),
        loadRegistroHoras(),
        loadGlobalCliente(state.fechaDesde || null, state.fechaHasta || null),
      ]);
      // El CPME es del cliente: incluye el gasto de las campañas globales (sin comunidad).
      content.innerHTML = renderObjetivos(datos, global ? [...rango, global] : rango, registros, state.fechaDesde || '', state.fechaHasta || '');
      wireObjetivos();

    } else if (state.tab === 'atribucion') {
      content.innerHTML = renderAtribucion();

    } else if (state.tab === 'base_limpia') {
      state.baseLimpiaFiltro = state.baseLimpiaFiltro || { comunidad:null, busqueda:'', pagina:1 };
      const [lista, comunidades] = await Promise.all([loadBaseLimpia(filtroDatos()), loadComunidadesPerformance()]);
      content.innerHTML = renderBaseLimpia(lista.filas, comunidades, state.baseLimpiaFiltro, lista.total, filtroDatos());
      wireBaseLimpia();

    } else if (state.tab === 'dedup') {
      const [lista, comunidades] = await Promise.all([loadEventoDeduplicado(filtroDatos()), loadComunidades()]);
      const byId = new Map(comunidades.map(c => [c.id, c.nombre]));
      content.innerHTML = renderDedup(lista.filas, byId, lista.total, filtroDatos(), comunidades);
      wireFiltrosDatos();

    } else if (state.tab === 'crudo') {
      state.repetidos = state.repetidos || { tipo: 'todos' };
      const fd = filtroDatos();
      const [eventos, intentos, comunidades, envios, repetidos] = await Promise.all([loadEventoCrudo(fd), loadIntentosRechazados(fd), loadComunidades(), loadEnviosPlanilla(), loadContactosRepetidos(fd)]);
      const byId = new Map(comunidades.map(c => [c.id, c.nombre]));
      content.innerHTML = renderFiltrosDatos(fd, comunidades, 'Contactos repetidos, el registro y el CSV usan estos filtros.') + renderRepetidos(repetidos, comunidades, state.repetidos) + renderCrudo(eventos, intentos, byId, state.crudoFiltro || 'todos', envios);
      wireFiltrosDatos();
      wireRepetidos(repetidos);
      wireCrudo();
    }
  } catch (err) {
    content.innerHTML = `<div class="card"><h3>Error consultando Supabase</h3><div class="sub" style="color:var(--danger)">${esc(err.message)}</div></div>`;
  }
}

/* ---------- login con SSO (Cloudflare) y sesión — specs/2026-10-21-sso-cloudflare-y-roles.md ---------- */
// El login lo hace la Edge Function auth-cloudflare: vuelve con la sesión de Supabase en el fragmento (#access_token=…),
// que supabase-js toma solo, o con #sso_error=<código>. La sesión dura 24 h desde el login (la controla la base).
const configError = document.getElementById('configError');
const SSO_URL = cfg.SUPABASE_URL ? String(cfg.SUPABASE_URL).replace(/\/+$/, '') + '/functions/v1/auth-cloudflare' : '';
const MENSAJES_SSO = {
  sin_alta: (email) => `La cuenta ${email || ''} todavía no está dada de alta en el CRM. Pedile el acceso a un administrador.`,
  dominio: (email) => `Solo pueden entrar cuentas @taquion.com.ar${email ? ` (entraste con ${email})` : ''}.`,
  cancelado: () => 'Cloudflare no autorizó el ingreso con esa cuenta.',
  vencido: () => 'El intento de ingreso venció o no es válido. Volvé a intentarlo.',
  sin_email: () => 'Cloudflare no informó un email verificado.',
  token: () => 'El login no se pudo validar. Volvé a intentarlo.',
  config: () => 'El login todavía no está configurado (faltan los secretos de la función auth-cloudflare).',
  cloudflare: () => 'No se pudo hablar con Cloudflare. Volvé a intentarlo en un momento.',
  supabase: () => 'No se pudo crear la sesión. Volvé a intentarlo en un momento.',
};
const ACCESO_REVISION_MS = 5 * 60 * 1000;

function leerErrorSso(){
  const h = new URLSearchParams(location.hash.slice(1));
  const codigo = h.get('sso_error');
  if (!codigo) return null;
  history.replaceState(null, '', location.pathname + location.search);
  return { codigo, email: h.get('email') };
}
const irAlLogin = () => { location.href = SSO_URL + '/login'; };
async function salir(){
  try { await supabase.auth.signOut(); } catch (_) { /* igual se sale de Cloudflare */ }
  location.href = SSO_URL + '/logout';
}
function pantallaAcceso(titulo, detalle){
  document.getElementById('nav').innerHTML = '';
  document.getElementById('sesionInfo').innerHTML = '';
  document.getElementById('content').innerHTML = '';
  document.getElementById('hTitle').textContent = 'CRM de Comunidades';
  document.getElementById('hSub').textContent = 'Ingreso con la cuenta de Taquion';
  configError.style.display = 'block';
  configError.innerHTML = `<h3>${esc(titulo)}</h3><div class="sub">${esc(detalle)}</div>
    <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap">
      <button class="btn" id="btnSsoEntrar" type="button" style="background:var(--accent); border-color:var(--accent); color:#fff">Entrar con la cuenta de Taquion</button>
      <button class="btn" id="btnSsoSalir" type="button">Cerrar sesión y entrar con otra cuenta</button>
    </div>`;
  document.getElementById('btnSsoEntrar').onclick = async () => { try { await supabase.auth.signOut({ scope: 'local' }); } catch (_) {} irAlLogin(); };
  document.getElementById('btnSsoSalir').onclick = salir;
}
function renderSesion(){
  const a = state.acceso;
  document.getElementById('sesionInfo').innerHTML = `<span class="sesion-email">${esc(a.email)}</span>
    <span class="sesion-rol">${esc(ROL_LABEL[a.rol] || a.rol)}${a.admin ? ' · administrador' : ''}</span>
    <button type="button" class="link-btn" id="btnSalir">Salir</button>`;
  document.getElementById('btnSalir').onclick = salir;
}
// Rol y permiso del usuario según la base (mi_acceso, db/030). Vacío = sesión vencida (24 h) o sin acceso.
async function cargarAcceso(){
  const { data, error } = await supabase.rpc('mi_acceso');
  const a = Array.isArray(data) ? data[0] : data;
  if (error || !a) {
    state.acceso = null;
    pantallaAcceso('Tu sesión venció o tu usuario no tiene acceso',
      'La sesión del CRM dura 24 horas. Si te dieron de baja o te cambiaron el acceso, consultalo con un administrador.');
    return false;
  }
  state.acceso = a;
  state.accesoRevisadoEn = Date.now();
  renderSesion();
  return true;
}
// Se vuelve a mirar cada 5 minutos: una baja o el vencimiento de la sesión se reflejan al navegar.
async function accesoVigente(){
  if (state.acceso && Date.now() - (state.accesoRevisadoEn || 0) < ACCESO_REVISION_MS) return true;
  return cargarAcceso();
}

if (!supabase) {
  configError.style.display = 'block';
  configError.innerHTML = '<h3 style="color:var(--danger)">Config no disponible</h3><div class="sub">Falta SUPABASE_URL/SUPABASE_ANON_KEY (variables de entorno de Vercel).</div>';
} else {
  iniciar();
}

async function iniciar(){
  const errorSso = leerErrorSso();
  if (errorSso) {
    pantallaAcceso('No se pudo entrar al CRM', (MENSAJES_SSO[errorSso.codigo] || (() => 'Ocurrió un error inesperado en el login.'))(errorSso.email));
    return;
  }
  const { data: { session } } = await supabase.auth.getSession();
  if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname + location.search);
  if (!session) {
    document.getElementById('content').innerHTML = '<div class="card"><h3>Redirigiendo al login de Taquion…</h3></div>';
    irAlLogin();
    return;
  }
  supabase.auth.onAuthStateChange((evento) => { if (evento === 'SIGNED_OUT') pantallaAcceso('Cerraste sesión', 'Para volver a entrar, usá la cuenta de Taquion.'); });
  if (!(await cargarAcceso())) return;
  try {
    const { data, error } = await supabase.from('cliente').select('id, nombre, slug').eq('activo', true).order('nombre');
    if (error) throw error;
    state.clientes = data || [];
  } catch (err) {
    configError.style.display = 'block';
    configError.innerHTML = `<h3 style="color:var(--danger)">No se pudo cargar la lista de clientes</h3><div class="sub" style="color:var(--danger)">${esc(err.message)}</div>`;
    return;
  }
  const guardado = leerClienteGuardado();
  state.clienteId = (state.clientes.find(c => c.id === guardado) || state.clientes[0] || {}).id || null;
  renderSelectorCliente();
  enterApp();
}
</script>
