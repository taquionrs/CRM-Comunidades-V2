<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM de Comunidades V2</title>
<style>
:root{
  --bg:#0B0D12; --panel:#12151C; --panel-raised:#1A1E27; --panel-sunken:#0E1016;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.22);
  --text-strong:#FFFFFF; --text-body:#C7CBD4; --text-muted:#8B90A0; --text-faint:#5B6070;
  --accent:#4C7EFF; --accent-dim:rgba(76,126,255,.14);
  --warn:#FF9D3D; --danger:#FF5C7A;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-in:5px; --r-card:9px;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{background:var(--bg); color:var(--text-body); font-family:var(--font)}
h1,h2,h3,h4{color:var(--text-strong); margin:0; font-weight:700}
button,input,select{font-family:inherit}
[hidden]{display:none !important}

.btn{display:inline-flex; align-items:center; gap:6px; border-radius:var(--r-in); border:1px solid var(--border-strong); background:transparent; color:var(--text-strong); padding:9px 14px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap}
.btn:hover{background:var(--panel-raised)}
.btn.on{background:var(--accent-dim); border-color:var(--accent); color:#fff}
.btn[disabled]{opacity:.4; cursor:not-allowed}

.app{display:grid; grid-template-columns:230px 1fr; min-height:100vh}
.sidebar{background:var(--panel-sunken); border-right:1px solid var(--border); padding:20px 14px; display:flex; flex-direction:column}
.sidebar-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:20px}
.sidebar-head .brand-sub{margin-bottom:0}
.icono-btn{width:30px; height:30px; flex-shrink:0; border:1px solid var(--border-strong); background:transparent; color:var(--text-body); border-radius:var(--r-in); cursor:pointer; font-size:15px; line-height:1; display:inline-flex; align-items:center; justify-content:center}
.icono-btn:hover{background:var(--panel-raised); color:#fff}
.main-head-fila{display:flex; align-items:flex-start; gap:12px}
.app.menu-oculto{grid-template-columns:1fr}
.app.menu-oculto .sidebar{display:none}
.app.menu-oculto .main{max-width:none}
.brand{font-size:14px; font-weight:700; color:#fff; margin-bottom:2px}
.brand-sub{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:20px}
.navlist{display:flex; flex-direction:column; gap:2px; margin-bottom:auto}
.nav-item{display:block; text-align:left; padding:9px 10px; border-radius:var(--r-in); font-size:13px; color:var(--text-body); background:none; border:1px solid transparent; cursor:pointer; width:100%}
.nav-item:hover{background:var(--panel-raised)}
.nav-item.active{background:var(--accent-dim); border-color:rgba(76,126,255,.4); color:#fff; font-weight:700}
.sidebar-foot{padding-top:14px; border-top:1px solid var(--border); font-size:11px; color:var(--text-faint)}

.main{padding:26px 32px 60px; max-width:1280px}
.main-head{margin-bottom:20px}
.main-head h2{font-size:20px}
.main-head .sub{font-size:12.5px; color:var(--text-muted); margin-top:3px}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:20px}
.kpi{background:var(--panel); border:1px solid var(--border); border-radius:var(--r-card); padding:14px 16px}
.kpi .v{font-size:22px; font-weight:800; color:#fff; line-height:1.15}
.kpi .l{font-size:10.5px; color:var(--text-muted); margin-top:6px; text-transform:uppercase; letter-spacing:.03em}

.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--r-card); padding:18px; margin-bottom:16px}
.card h3{font-size:13.5px; margin-bottom:3px}
.card .sub{font-size:11.5px; color:var(--text-muted); margin-bottom:14px}

table{border-collapse:collapse; width:100%}
th{text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); padding:0 10px 8px; border-bottom:1px solid var(--border)}
td{padding:9px 10px; font-size:12px; color:var(--text-body); border-bottom:1px solid var(--border); vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.totales td{font-weight:800; color:#fff; border-top:1px solid var(--border-strong)}
.tbl-wrap{overflow-x:auto}
.mono{font-variant-numeric:tabular-nums; color:var(--text-muted)}
.empty-row td{color:var(--text-faint); text-align:center; padding:20px 10px}
.na{color:var(--text-faint)}

.filters{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:flex-end}
.filters label{display:flex; flex-direction:column; gap:4px; font-size:10.5px; color:var(--text-faint)}
.filters input, .filters select{background:var(--panel-raised); border:1px solid var(--border-strong); color:#fff; font-size:12px; padding:7px 9px; border-radius:var(--r-in)}

.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.tabla-metricas{border-collapse:separate; border-spacing:0; min-width:100%}
.tabla-metricas th, .tabla-metricas td{text-transform:none; letter-spacing:0}
.tabla-metricas .th-gr{padding:0; border-bottom:none; background:color-mix(in srgb, var(--gc) 12%, var(--panel))}
.tabla-metricas .th-gr-in{display:flex; align-items:center; gap:7px; padding:9px 12px; color:var(--gc); font-size:11.5px; font-weight:800; border-top:2px solid var(--gc); border-radius:6px 6px 0 0}
.tabla-metricas .th-col{vertical-align:bottom; white-space:normal; min-width:104px; max-width:150px; padding:8px 10px 9px; font-size:11.5px; line-height:1.3; font-weight:700; color:var(--text-strong); background:color-mix(in srgb, var(--gc) 8%, var(--panel)); border-bottom:1px solid var(--border-strong); text-align:right}
.tabla-metricas .th-txt{margin-right:4px}
.tabla-metricas td.num{text-align:right; white-space:nowrap; background:color-mix(in srgb, var(--gc) 4%, transparent); font-variant-numeric:tabular-nums}
.tabla-metricas .g-ini{border-left:1px solid color-mix(in srgb, var(--gc) 55%, transparent)}
.tabla-metricas .th-com, .tabla-metricas .td-com{position:sticky; left:0; z-index:2; background:var(--panel); text-align:left; font-size:12px; font-weight:700; color:var(--text-strong); padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap}
.tabla-metricas .th-com{z-index:3; vertical-align:bottom; font-size:11.5px; border-bottom:1px solid var(--border-strong)}
.tabla-metricas tbody tr:hover td.num, .tabla-metricas tbody tr:hover .td-com{background:color-mix(in srgb, var(--gc, var(--accent)) 10%, var(--panel-raised))}
.tabla-metricas tbody tr.totales td, .tabla-metricas tbody tr.totales .td-com{border-top:1px solid var(--border-strong); font-weight:800; color:#fff}
.tabla-metricas .moneda, .tabla-metricas .entero{color:var(--text-strong); font-weight:600}
.tabla-metricas .pct{display:inline-block; padding:2px 9px; border-radius:99px; font-weight:800; font-size:11.5px; color:#fff; background:rgba(76,126,255,.28); border:1px solid rgba(120,160,255,.55)}
.tabla-metricas .vacio{display:inline-block; padding:2px 9px; border-radius:99px; font-size:10.5px; font-weight:600; color:var(--text-muted); background:rgba(255,255,255,.05); border:1px dashed var(--border-strong); cursor:help; white-space:nowrap}
.info-btn{width:15px; height:15px; padding:0; border-radius:50%; border:1px solid var(--border-strong); background:transparent; color:var(--text-muted); font-size:10px; font-weight:800; font-style:italic; font-family:Georgia,serif; line-height:1; cursor:help; vertical-align:middle}
.info-btn:hover, .info-btn:focus-visible{color:#fff; border-color:#fff; background:rgba(255,255,255,.12)}
.info-btn:focus-visible, .tabla-metricas .vacio:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#tipFlotante{position:fixed; z-index:50; max-width:280px; padding:9px 11px; border-radius:var(--r-in); background:#222736; border:1px solid var(--border-strong); color:#fff; font-size:11.5px; line-height:1.45; font-weight:500; box-shadow:0 6px 24px rgba(0,0,0,.5); pointer-events:none}
.th-grupo{display:block; font-size:8.5px; letter-spacing:.06em; margin-bottom:3px; opacity:.85}
.col-wrap{position:relative}
.col-panel{position:absolute; top:calc(100% + 6px); left:0; z-index:30; width:380px; max-height:70vh; overflow:auto; background:var(--panel-raised); border:1px solid var(--border-strong); border-radius:var(--r-card); box-shadow:0 12px 32px rgba(0,0,0,.5); padding:10px}
.col-panel-head{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap}
.col-panel-head b{color:var(--text-strong); font-size:13px}
.col-panel-head span{font-size:10.5px; color:var(--text-faint); flex:1}
.col-panel ul{list-style:none; margin:0; padding:0}
.col-panel li{display:flex; align-items:center; gap:8px; padding:6px 6px; border-radius:var(--r-in); border:1px solid transparent; font-size:12px}
.col-panel li:hover{background:var(--panel-sunken)}
.col-panel li.arrastrando{opacity:.4}
.col-panel li.sobre{border-color:var(--accent); background:var(--accent-dim)}
.col-panel li label{display:flex; flex-direction:row; align-items:center; gap:7px; flex:1; font-size:12px; color:var(--text-body); cursor:pointer}
.col-panel li input[type=checkbox]{width:auto; padding:0; margin:0; background:none; border:0; accent-color:var(--accent)}
.col-panel li small{font-size:9.5px; white-space:nowrap}
.col-panel .grip{cursor:grab; color:var(--text-faint); user-select:none; letter-spacing:-2px}
.btn-mini{padding:3px 8px; font-size:11px}

.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--border-strong); background:transparent; color:var(--text-body); border-radius:99px; padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer}
.chip:hover{background:var(--panel-raised)}
.chip.on{background:var(--accent-dim); border-color:var(--accent); color:#fff}
.chip .n{color:var(--text-faint); margin-left:4px; font-weight:400}
.est{display:inline-flex; padding:3px 9px; border-radius:99px; font-size:10px; font-weight:700; white-space:nowrap}
.est.ok{background:rgba(63,185,120,.15); color:#5fd39a}
.est.mal{background:rgba(255,92,122,.16); color:var(--danger)}
.est.medio{background:rgba(255,157,61,.16); color:var(--warn)}
.modal-full{position:fixed; inset:0; z-index:1000; background:var(--bg); display:flex; flex-direction:column}
.modal-full-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:18px 24px; border-bottom:1px solid var(--border); background:var(--panel)}
.modal-full-acciones{display:flex; gap:8px; flex-shrink:0}
.modal-full-cuerpo{flex:1; overflow:auto; padding:20px 24px 32px}

.form-row{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; padding:14px; background:var(--panel-raised); border:1px solid var(--border); border-radius:var(--r-in)}
.form-row label{display:flex; flex-direction:column; gap:4px; font-size:10.5px; color:var(--text-faint)}
.form-row input{background:var(--panel-sunken); border:1px solid var(--border-strong); color:#fff; font-size:12px; padding:7px 9px; border-radius:var(--r-in)}

.pill{display:inline-flex; padding:3px 9px; border-radius:99px; font-size:10px; font-weight:700; background:var(--panel-raised); border:1px solid var(--border-strong); color:var(--text-muted); white-space:nowrap}
.pill-ig{color:#e879b9; border-color:rgba(232,121,185,.45); background:rgba(232,121,185,.1)}
.pill-ok{color:#3ddc97; border-color:rgba(61,220,151,.4); background:rgba(61,220,151,.08)}
.pill-bad{color:var(--danger); border-color:rgba(255,92,122,.45); background:rgba(255,92,122,.1)}
.btn-on{background:var(--accent-dim); border-color:var(--accent); color:#fff}
.badge-warn{color:var(--warn); border-color:rgba(255,157,61,.4); background:rgba(255,157,61,.08)}
.hint{cursor:help; color:var(--warn); font-weight:700; margin-left:4px; border-bottom:1px dotted var(--warn)}
.nota-campo{font-size:11.5px; color:var(--warn); margin:8px 0 0}
.codeblock{font-family:ui-monospace,monospace; font-size:11px; color:var(--text-muted); white-space:pre-wrap; word-break:break-all; max-width:360px}
.cliente-sel{display:flex; flex-direction:column; gap:4px; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:18px}
.cliente-sel select{background:var(--panel-raised); border:1px solid var(--border-strong); color:#fff; font-size:13px; padding:8px 9px; border-radius:var(--r-in); text-transform:none; letter-spacing:0; width:100%}
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar" id="menuLateral">
    <div class="sidebar-head">
      <div>
        <div class="brand">Comunidades V2</div>
        <div class="brand-sub">CRM interno · Taquión</div>
      </div>
      <button type="button" class="icono-btn" id="btnMenuCerrar" title="Ocultar el menú" aria-label="Ocultar el menú" aria-controls="menuLateral" aria-expanded="true">«</button>
    </div>
    <label class="cliente-sel">Cliente<select id="selCliente" aria-label="Cliente"></select></label>
    <nav class="navlist" id="nav"></nav>
    <div class="sidebar-foot">
      <span style="color:var(--warn)">Sin login (temporal)</span>
    </div>
  </aside>
  <main class="main">
    <div class="main-head">
      <div class="main-head-fila">
        <button type="button" class="icono-btn" id="btnMenuAbrir" title="Mostrar el menú" aria-label="Mostrar el menú" aria-controls="menuLateral" aria-expanded="false" hidden>☰</button>
        <div>
          <h2 id="hTitle">—</h2>
          <div class="sub" id="hSub">—</div>
        </div>
      </div>
    </div>
    <div id="configError" class="card" style="display:none; border-color:var(--danger)"></div>
    <div id="content"></div>
  </main>
</div>

<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const cfg = window.CRM_COMUNIDADES_V2_CONFIG || {};
const supabase = (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY)
  ? createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { db: { schema: 'crm_comunidades_v2' } })
  : null;

/* ---------- estado + navegación ---------- */
const TABS = [
  { key:'overview', label:'Overview' },
  { key:'control', label:'Control_Comunidades' },
  { key:'atribucion', label:'Atribucion' },
  { key:'base_limpia', label:'Base_Limpia' },
  { key:'dedup', label:'Data_Deduplicada' },
  { key:'crudo', label:'Data_Cruda' },
];
const TAB_SUB = {
  overview:'Panel ejecutivo macro — KPIs globales y distribución por comunidad',
  control:'Métricas de performance por plataforma (Meta Ads · ManyChat · WhatsApp)',
  atribucion:'Modelo de atribución: qué anuncio o canal trajo a cada persona — en construcción',
  base_limpia:'Gestor de usuarios nominados — vista de cliente',
  dedup:'Log técnico de atribución — primer evento por teléfono',
  crudo:'Registro de eventos recibidos de ManyChat — con nombre, comunidad y detalle',
};
/* MENU-LATERAL:INICIO */
// El menú lateral se puede ocultar para ganar ancho (útil en la matriz de Control_Comunidades). La preferencia queda en este
// navegador; si no hay almacenamiento disponible, vale solo para la sesión.
const CLAVE_MENU_OCULTO = 'crm_v2_menu_oculto';
function leerMenuOculto(){
  try { return localStorage.getItem(CLAVE_MENU_OCULTO) === '1'; } catch (_) { return false; }
}
function aplicarMenuOculto(oculto, guardar = true){
  document.getElementById('app').classList.toggle('menu-oculto', oculto);
  document.getElementById('btnMenuAbrir').hidden = !oculto;
  document.getElementById('btnMenuAbrir').setAttribute('aria-expanded', String(!oculto));
  document.getElementById('btnMenuCerrar').setAttribute('aria-expanded', String(!oculto));
  if (guardar) { try { localStorage.setItem(CLAVE_MENU_OCULTO, oculto ? '1' : '0'); } catch (_) { /* sin almacenamiento */ } }
  if (oculto) document.getElementById('btnMenuAbrir').focus(); else document.getElementById('btnMenuCerrar').focus();
}
function iniciarMenuLateral(){
  document.getElementById('btnMenuCerrar').onclick = () => aplicarMenuOculto(true);
  document.getElementById('btnMenuAbrir').onclick = () => aplicarMenuOculto(false);
  if (leerMenuOculto()) {
    document.getElementById('app').classList.add('menu-oculto');
    document.getElementById('btnMenuAbrir').hidden = false;
    document.getElementById('btnMenuAbrir').setAttribute('aria-expanded', 'false');
    document.getElementById('btnMenuCerrar').setAttribute('aria-expanded', 'false');
  }
}
/* MENU-LATERAL:FIN */
iniciarMenuLateral();

/* TOOLTIP-INFO:INICIO */
// Un solo globo flotante para todos los botones "i" y los estados vacíos de la tabla: así no lo recorta el scroll horizontal.
(function(){
  let tip = null;
  const cerrar = () => { if (tip) { tip.remove(); tip = null; } };
  const abrir = (el) => {
    const texto = el.dataset.info || el.dataset.ayuda; if (!texto) return;
    cerrar();
    tip = document.createElement('div'); tip.id = 'tipFlotante'; tip.setAttribute('role', 'tooltip'); tip.textContent = texto;
    document.body.appendChild(tip);
    const r = el.getBoundingClientRect(), w = tip.offsetWidth;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
    tip.style.top = (r.bottom + 8) + 'px';
    if (tip.getBoundingClientRect().bottom > window.innerHeight - 8) tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + 'px';
  };
  const esInfo = (e) => e.target && e.target.closest ? e.target.closest('.info-btn, .vacio[data-ayuda]') : null;
  document.addEventListener('mouseover', e => { const b = esInfo(e); if (b) abrir(b); });
  document.addEventListener('mouseout', e => { if (esInfo(e)) cerrar(); });
  document.addEventListener('focusin', e => { const b = esInfo(e); if (b) abrir(b); });
  document.addEventListener('focusout', cerrar);
  document.addEventListener('click', e => { const b = esInfo(e); if (b) abrir(b); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });
})();
/* TOOLTIP-INFO:FIN */

let state = { tab:'overview', entered:false, clienteId:null, clientes:[], columnasControl:null, columnasAbierto:false };

/* ---------- selector de cliente ---------- */
function leerClienteGuardado(){
  try { return localStorage.getItem('crm_v2_cliente'); } catch { return null; }
}
function guardarCliente(id){
  try { localStorage.setItem('crm_v2_cliente', id || ''); } catch { /* sin storage: no pasa nada */ }
}
function renderSelectorCliente(){
  const sel = document.getElementById('selCliente');
  sel.innerHTML = state.clientes.length
    ? state.clientes.map(c => `<option value="${c.id}" ${c.id===state.clienteId?'selected':''}>${esc(c.nombre)}</option>`).join('')
    : '<option value="">Sin clientes</option>';
  sel.disabled = state.clientes.length < 1;
  sel.onchange = () => {
    state.clienteId = sel.value || null;
    guardarCliente(state.clienteId);
    state.filtroComunidad = null;
    state.baseLimpiaFiltro = null;
    state.fechaDesde = null;
    state.fechaHasta = null;
    renderAll();
  };
}

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = TABS.map(t => `<button class="nav-item ${state.tab===t.key?'active':''}" data-t="${t.key}">${t.label}</button>`).join('');
  nav.querySelectorAll('.nav-item').forEach(btn => btn.onclick = () => { state.tab = btn.dataset.t; renderAll(); });
}

function enterApp(){
  if (!state.entered) { state.entered = true; renderAll(); }
}

/* ---------- helpers ---------- */
const fmtMoney = v => v==null ? '—' : '$' + Number(v).toLocaleString('es-AR', { maximumFractionDigits:2 });
const fmtInt = v => v==null ? '—' : Number(v).toLocaleString('es-AR');
const fmtPct = v => v==null ? '—' : Math.round(v*10)/10 + '%';
const fmtFecha = v => v ? new Date(v).toLocaleString('es-AR') : '—';
const esc = v => String(v ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
/* Canal de la persona: el identificador es un teléfono (WhatsApp) o "ig:<id>" (Instagram), ver db/008 */
const esInstagram = id => String(id ?? '').startsWith('ig:');
const canalPill = id => esInstagram(id) ? '<span class="pill pill-ig">Instagram</span>' : '<span class="pill">WhatsApp</span>';
const idVisible = (id, payload) => {
  const user = payload && payload.contact && payload.contact.ig_username;
  return esInstagram(id) && user ? '@' + user : id;
};
/* Aviso de dónde viene el campo "Nombre": ⓘ en el encabezado (hover) + nota visible bajo el título */
const NOMBRE_ORIGEN = 'Nombre: user name de WhatsApp o Instagram de la persona (según el canal). Lo envía ManyChat tal cual lo tiene el perfil; puede ser un alias, un emoji o un punto, y no es un dato verificado.';
const thNombre = `<th>Nombre <span class="hint" title="${esc(NOMBRE_ORIGEN)}">ⓘ</span></th>`;
const notaNombre = `<div class="nota-campo">ⓘ ${esc(NOMBRE_ORIGEN)}</div>`;
const naCell = (nota) => `<span class="na" title="${esc(nota)}">— sin fuente</span>`;

function kpiGrid(items){
  return '<div class="kpi-grid">' + items.map(([v,l]) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('') + '</div>';
}

/* ---------- loaders ---------- */
async function loadKpisMacro(){
  const { data, error } = await supabase.from('kpis_macro').select('*').eq('cliente_id', state.clienteId).maybeSingle();
  if (error) throw error;
  return data;
}
async function loadComunidadesPerformance(){

function renderOverview(kpis, comunidades){
  const k = kpis || {};

    [fmtMoney(k.inversion_total), 'Inversión total Meta'],
    [fmtInt(k.conversaciones_totales), 'Conversaciones totales (Meta)'],
    [fmtMoney(k.cpl_global), 'CPL global'],

    [fmtInt(k.miembros_efectivos_totales), 'Miembros efectivos totales'],
    [fmtMoney(k.cpme_global), 'CPME global'],
    [fmtPct(k.tasa_fuga_global_pct), 'Tasa de fuga global'],
  ]);

  const totalMf = comunidades.reduce((s,c) => s + (c.miembros_finales||0), 0);
  const rows = comunidades.length

function wireComunidadesForm(){
  const wrap = document.getElementById('comunidadesFormWrap');
  if (!wrap) return;
  const resultado = document.getElementById('comunidadResultado');

  wrap.querySelectorAll('.btn-guardar-comunidad').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const fila = btn.closest('tr');
      const payload = {};
      fila.querySelectorAll('.mi-input').forEach(inp => { payload[inp.dataset.field] = Number(inp.value); });
      btn.disabled = true; btn.textContent = 'Guardando…';
      try { await actualizarComunidad(id, payload); await refrescarOverview(); }
      catch (err) { resultado.innerHTML = `<span style="color:var(--danger)">Error: ${esc(err.message)}</span>`; }
    };
  });

  const btnCargar = document.getElementById('btnCargarMiembros');
  if (btnCargar) btnCargar.onclick = abrirCargaMiembros;

  const form = document.getElementById('formNuevaComunidad');
  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    try {
      await crearComunidad({
        nombre: fd.get('nombre'),
        adset_name: fd.get('adset_name') || null,
        miembros_iniciales: Number(fd.get('miembros_iniciales')) || 0,
        miembros_finales: Number(fd.get('miembros_finales')) || 0,
      });
      form.reset();
      await refrescarOverview();
    } catch (err) {
      resultado.innerHTML = `<span style="color:var(--danger)">Error: ${esc(err.message)}</span>`;
    }
  };
}

async function refrescarOverview(){
  const [kpis, comunidades] = await Promise.all([loadKpisMacro(), loadComunidadesPerformance()]);
  document.getElementById('content').innerHTML = renderOverview(kpis, comunidades);
  wireComunidadesForm();
}

function tramosDeGrupos(columnas){
  const tramos = [];
  for (const col of columnas) {
    const ultimo = tramos[tramos.length - 1];
    if (ultimo && ultimo.grupo === col.grupo) ultimo.n++;
    else tramos.push({ grupo: col.grupo, n: 1 });
  }
  return tramos;
}

  const ids = COLUMNAS_CONTROL.map(c => c.id);
  const orden = (Array.isArray(g.orden) ? g.orden : []).filter((id, i, a) => ids.includes(id) && a.indexOf(id) === i);
  for (const id of ids) if (!orden.includes(id)) orden.push(id);
  const ocultas = (Array.isArray(g.ocultas) ? g.ocultas : []).filter(id => ids.includes(id));
  return { orden, ocultas };
}
function guardarColumnasControl(cfg){
  state.columnasControl = cfg;
  try { localStorage.setItem(CLAVE_COLUMNAS_CONTROL, JSON.stringify(cfg)); } catch (_) { /* sin almacenamiento: vale solo para esta sesión */ }
}
// Mueve la columna `id` justo antes de `antesDe` (o al final si es null).
function moverColumnaControl(orden, id, antesDe){
  const sin = orden.filter(x => x !== id);
  const i = antesDe == null ? sin.length : sin.indexOf(antesDe);
  sin.splice(i < 0 ? sin.length : i, 0, id);
  return sin;
}

/* ATAJOS-FECHAS:INICIO */
// Atajos de período de Control_Comunidades. Siempre en hora de Buenos Aires (la misma zona con que el CRM fecha las entradas).
// "Últimos N días" incluye HOY y los N-1 anteriores. "Ayer" es un solo día.
const ZONA_AR = 'America/Argentina/Buenos_Aires';
function hoyAR(ahora = new Date()){ return new Intl.DateTimeFormat('en-CA', { timeZone: ZONA_AR }).format(ahora); }
function sumarDias(fecha, n){
  const [a, m, d] = fecha.split('-').map(Number);
  return new Date(Date.UTC(a, m - 1, d + n)).toISOString().slice(0, 10);
}
const ATAJOS_FECHAS = [
  { id: 'ayer', etiqueta: 'Ayer',           rango: (hoy) => ({ desde: sumarDias(hoy, -1),  hasta: sumarDias(hoy, -1) }) },
  { id: '7',    etiqueta: 'Últimos 7 días',  rango: (hoy) => ({ desde: sumarDias(hoy, -6),  hasta: hoy }) },
  { id: '10',   etiqueta: 'Últimos 10 días', rango: (hoy) => ({ desde: sumarDias(hoy, -9),  hasta: hoy }) },
  { id: '15',   etiqueta: 'Últimos 15 días', rango: (hoy) => ({ desde: sumarDias(hoy, -14), hasta: hoy }) },
  { id: '30',   etiqueta: 'Últimos 30 días', rango: (hoy) => ({ desde: sumarDias(hoy, -29), hasta: hoy }) },
];
/* ATAJOS-FECHAS:FIN */

function renderControl(comunidades, filtroComunidad, desde, hasta){
  const opciones = `<option value="">Todas las comunidades</option>` + comunidades.map(c => `<option value="${c.id}" ${filtroComunidad===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('');
  const porComunidad = filtroComunidad ? comunidades.filter(c => c.id === filtroComunidad) : comunidades;

  const cfg = state.columnasControl || (state.columnasControl = leerColumnasControl());
  const porId = Object.fromEntries(COLUMNAS_CONTROL.map(c => [c.id, c]));
  const visibles = cfg.orden.filter(id => !cfg.ocultas.includes(id)).map(id => porId[id]);

  // Total del cliente: suma de TODAS las comunidades (aunque haya una elegida en el filtro) y razones recalculadas
  // con esos totales, no promediando las filas. Las entradas no se duplican: la atribución es por primer contacto.
  const suma = (campo) => comunidades.reduce((s, c) => s + (Number(c[campo]) || 0), 0);
  const t = {
    razon: (num, den, factor = 1) => (den > 0 ? (num / den) * factor : null),
    inv: suma('inversion'), conv: suma('conversaciones_meta'), ent: suma('clics_unicos'), leads: suma('leads_meta'),
    mi: suma('miembros_iniciales'), mf: suma('miembros_finales'), bajas: suma('bajas_estimadas'), trig: suma('triggers_entregados'),
    clics: suma('clics'), impresiones: suma('impresiones'), clicsms: suma('clics_me_sumo'),
  };

  const inicios = iniciosDeTramo(visibles);
  const claseGrupo = (col, k) => 'g-' + (GRUPOS_TABLA[col.grupo] ? GRUPOS_TABLA[col.grupo].k : 'otro') + (inicios[k] ? ' g-ini' : '');
  const tramos = tramosDeGrupos(visibles);
  const encabezadoGrupos = tramos.map(tr => { const g = GRUPOS_TABLA[tr.grupo] || { k:'otro', color:'#8B90A0', icono:'' };
    return `<th colspan="${tr.n}" scope="colgroup" class="th-gr g-${g.k} g-ini" style="--gc:${g.color}"><span class="th-gr-in">${g.icono}${esc(tr.grupo)}</span></th>`; }).join('');
  const encabezados = visibles.map((col, k) => { const g = GRUPOS_TABLA[col.grupo] || { color:'#8B90A0' };
    return `<th scope="col" class="th-col ${claseGrupo(col, k)}" style="--gc:${g.color}"><span class="th-txt">${esc(col.etiqueta)}</span><button type="button" class="info-btn" data-info="${esc(col.info || '')}" aria-label="Qué significa: ${esc(col.etiqueta)}">i</button></th>`; }).join('');
  const celdas = (fn) => visibles.map((col, k) => { const g = GRUPOS_TABLA[col.grupo] || { color:'#8B90A0' };
    return `<td class="num ${claseGrupo(col, k)}" style="--gc:${g.color}">${fn(col)}</td>`; }).join('');

  const filas = porComunidad.length
    ? porComunidad.map(c => `<tr><th scope="row" class="td-com">${esc(c.nombre)}</th>${celdas(col => col.celda(c))}</tr>`).join('')
    : `<tr class="empty-row"><td colspan="${visibles.length + 1}">Sin datos todavía.</td></tr>`;
  const filaTotal = comunidades.length
    ? `<tr class="totales"><th scope="row" class="td-com">Total del cliente</th>${celdas(col => col.total(t))}</tr>`
    : '';

  const panelColumnas = state.columnasAbierto ? `<div class="col-panel" id="panelColumnas">
      <div class="col-panel-head"><b>Columnas</b><span>${visibles.length} de ${COLUMNAS_CONTROL.length} visibles · arrastrá para reordenar</span>
        <button class="btn btn-mini" id="btnColumnasReset" type="button">Restablecer</button></div>
      <ul>${cfg.orden.map((id, i) => {
        const col = porId[id];
        return `<li draggable="true" data-col-id="${id}">
          <span class="grip" title="Arrastrar">⋮⋮</span>
          <label><input type="checkbox" data-col-vis="${id}" ${cfg.ocultas.includes(id) ? '' : 'checked'}> ${esc(col.etiqueta)}</label>
          <small style="color:${COLOR_GRUPO[col.grupo] || 'var(--text-faint)'}">${esc(col.grupo)}</small>
          <button class="btn btn-mini" type="button" data-col-mover="${id}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
          <button class="btn btn-mini" type="button" data-col-mover="${id}" data-dir="1" ${i === cfg.orden.length - 1 ? 'disabled' : ''} aria-label="Bajar">↓</button>
        </li>`;
      }).join('')}</ul>
    </div>` : '';

  return `<div class="filters">
      <label>Comunidad<select id="selFiltroComunidad">${opciones}</select></label>
      <label>Desde<input type="date" id="inpFechaDesde" value="${esc(desde)}"></label>
      <label>Hasta<input type="date" id="inpFechaHasta" value="${esc(hasta)}"></label>
      <label>Período rápido<select id="selAtajo" aria-label="Período rápido">${(() => {
          const hoy = hoyAR();
          const activo = ATAJOS_FECHAS.find(a => { const r = a.rango(hoy); return desde === r.desde && hasta === r.hasta; });
          const vacio = (desde || hasta) && !activo ? 'Personalizado' : 'Elegir…';
          return `<option value="" ${activo ? '' : 'selected'}>${vacio}</option>` + ATAJOS_FECHAS.map(a => `<option value="${a.id}" ${activo && activo.id === a.id ? 'selected' : ''}>${a.etiqueta}</option>`).join('');
        })()}</select></label>
      <button class="btn ${!desde && !hasta ? 'on' : ''}" id="btnFechasLimpiar" type="button" aria-pressed="${!desde && !hasta ? 'true' : 'false'}">Todo el histórico</button>
      <div class="col-wrap"><button class="btn" id="btnColumnas" type="button" aria-expanded="${state.columnasAbierto ? 'true' : 'false'}">Columnas${cfg.ocultas.length ? ` (${cfg.ocultas.length} ocultas)` : ''}</button>${panelColumnas}</div>
      <button class="btn" id="btnConsultas" type="button" title="Ver todo lo que pasó entre Windsor y el CRM">Consultas</button>
    </div>
    <div class="card"><h3>Métricas por comunidad</h3>
      <div class="sub">Meta Ads · ManyChat · CRM</div>
      <div class="sub">Celdas marcadas "sin fuente" son datos que el webhook/integración actual todavía no captura — no se fabrican. El gasto y las conversaciones de Meta se asignan a cada comunidad por el nombre de la campaña y del conjunto de anuncios; no se atribuyen persona por persona (ver la sección Atribucion).</div>
      ${(desde || hasta) && (!hasta || hasta >= hoyAR()) ? `<div class="sub" style="color:var(--warn)">El período incluye hoy: las entradas del CRM están al día, pero la inversión y las conversaciones de Meta llegan a la mañana siguiente.</div>` : ''}
      <div class="tbl-wrap"><table class="tabla-metricas"><caption class="sr-only">Métricas por comunidad, agrupadas por fuente: ${tramosDeGrupos(visibles).map(x => x.grupo).join(', ')}</caption><thead><tr class="fila-grupos"><th rowspan="2" scope="col" class="th-com">Comunidad</th>${encabezadoGrupos}</tr><tr>${encabezados}</tr></thead><tbody>${filas}${filaTotal}</tbody></table></div>
    </div>`;
}

// Panel "Columnas": mostrar/ocultar, reordenar con ↑ ↓ o arrastrando, restablecer.
function wireColumnasControl(){
  const cfgActual = () => state.columnasControl || (state.columnasControl = leerColumnasControl());
  const aplicar = (cfg) => { guardarColumnasControl(cfg); renderAll(); };

  const btn = document.getElementById('btnColumnas');
  if (btn) btn.onclick = (ev) => { ev.stopPropagation(); state.columnasAbierto = !state.columnasAbierto; renderAll(); };

  const panel = document.getElementById('panelColumnas');
  if (!panel) return;
  panel.onclick = (ev) => ev.stopPropagation();

  panel.querySelectorAll('[data-col-vis]').forEach(chk => {
    chk.onchange = () => {
      const cfg = cfgActual(), id = chk.dataset.colVis;
      const ocultas = chk.checked ? cfg.ocultas.filter(x => x !== id) : [...cfg.ocultas.filter(x => x !== id), id];
      aplicar({ orden: cfg.orden, ocultas });
    };
  });
  panel.querySelectorAll('[data-col-mover]').forEach(b => {
    b.onclick = () => {
      const cfg = cfgActual(), id = b.dataset.colMover, dir = Number(b.dataset.dir);
      const i = cfg.orden.indexOf(id), j = i + dir;
      if (i < 0 || j < 0 || j >= cfg.orden.length) return;
      const orden = cfg.orden.slice();
      [orden[i], orden[j]] = [orden[j], orden[i]];
      aplicar({ orden, ocultas: cfg.ocultas });
    };
  });
  const reset = document.getElementById('btnColumnasReset');
  if (reset) reset.onclick = () => { try { localStorage.removeItem(CLAVE_COLUMNAS_CONTROL); } catch (_) {} state.columnasControl = null; renderAll(); };

  let arrastrando = null;
  panel.querySelectorAll('li[data-col-id]').forEach(li => {
    li.ondragstart = (ev) => { arrastrando = li.dataset.colId; li.classList.add('arrastrando'); ev.dataTransfer.effectAllowed = 'move'; try { ev.dataTransfer.setData('text/plain', arrastrando); } catch (_) {} };
    li.ondragend = () => { arrastrando = null; li.classList.remove('arrastrando'); panel.querySelectorAll('li.sobre').forEach(x => x.classList.remove('sobre')); };
    li.ondragover = (ev) => { if (arrastrando) { ev.preventDefault(); li.classList.add('sobre'); } };
    li.ondragleave = () => li.classList.remove('sobre');
    li.ondrop = (ev) => {
      ev.preventDefault();
      const destino = li.dataset.colId;
      if (!arrastrando || arrastrando === destino) return;
      const cfg = cfgActual();
      aplicar({ orden: moverColumnaControl(cfg.orden, arrastrando, destino), ocultas: cfg.ocultas });
    };
  });
}

function wireControl(){
  wireColumnasControl();
  // Cerrar el panel de columnas al hacer clic afuera o con Escape (se registra una sola vez).
  if (!window.__panelColumnasCierre) {

  }

  const desde = document.getElementById('inpFechaDesde');

  if (desde) desde.onchange = () => { state.fechaDesde = desde.value || null; renderAll(); };
  if (hasta) hasta.onchange = () => { state.fechaHasta = hasta.value || null; renderAll(); };

}

/* ================= Botón "Consultas": trazabilidad de Windsor (pantalla completa) ================= */
const TIPOS_CONSULTA = {
  entrega:    { etiqueta: 'Entrega de Windsor', ayuda: 'Windsor escribió o reemplazó filas en la base' },
  conversion: { etiqueta: 'Conversión',         ayuda: 'Se pasó lo recibido a las métricas por comunidad' },
  programada: { etiqueta: 'Programada',         ayuda: 'Trabajo diario automático (pg_cron)' },
  csv:        { etiqueta: 'CSV manual',         ayuda: 'Importación manual desde un archivo' },
  carga_miembros: { etiqueta: 'Carga de miembros', ayuda: 'Se cargó la lista de miembros de un grupo' },
};
const fmtFechaAR = (d) => d ? new Date(d).toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—';
function haceCuantoConsulta(d){
  if (!d) return 'nunca';
  const min = Math.max(0, Math.round((Date.now() - new Date(d).getTime()) / 60000));
  if (min < 1) return 'hace instantes';
  if (min < 60) return `hace ${min} min`;
  if (min < 48 * 60) return `hace ${Math.round(min / 60)} h`;
  return `hace ${Math.round(min / 1440)} días`;
}
const claseEstado = (e) => (e === 'ok' || e === 'succeeded') ? 'ok' : (e === 'error' || e === 'failed') ? 'mal' : 'medio';
const textoEstado = (e) => ({ ok: 'Correcto', succeeded: 'Correcto', error: 'Con error', failed: 'Con error', running: 'En curso', starting: 'Iniciando' }[e] || e);

// Contenido del modal. Función pura: recibe las filas de consultas_windsor y el filtro elegido.
function renderConsultasWindsor(filas, filtro){
  const ultimo = (tipo) => filas.find(f => f.tipo === tipo);
  const errores = filas.filter(f => claseEstado(f.estado) === 'mal').length;
  const tarjeta = (titulo, f, extra) => `<div class="kpi"><div class="v" style="font-size:15px">${f ? esc(haceCuantoConsulta(f.ocurrio_en)) : 'sin registros'}</div>
      <div class="l">${esc(titulo)}</div><div class="sub" style="margin-top:4px">${f ? esc(fmtFechaAR(f.ocurrio_en)) : ''}${extra ? ' · ' + esc(extra) : ''}</div></div>`;
  const resumen = `<div class="kpi-grid" style="margin-bottom:14px">
      ${tarjeta('Última entrega de Windsor', ultimo('entrega'), ultimo('entrega') ? fmtInt(ultimo('entrega').filas_origen) + ' filas' : '')}
      ${tarjeta('Última conversión a métricas', ultimo('conversion'), ultimo('conversion') ? fmtInt(ultimo('conversion').registros_escritos) + ' registros' : '')}
      ${tarjeta('Último trabajo programado', ultimo('programada'), ultimo('programada') ? textoEstado(ultimo('programada').estado) : '')}
      <div class="kpi"><div class="v" style="font-size:15px;${errores ? 'color:var(--danger)' : ''}">${errores}</div><div class="l">Corridas con error</div><div class="sub" style="margin-top:4px">en este listado</div></div>
    </div>`;

  const chips = [['todas', 'Todas']].concat(Object.entries(TIPOS_CONSULTA).map(([k, v]) => [k, v.etiqueta])).map(([k, t]) => {
    const n = k === 'todas' ? filas.length : filas.filter(f => f.tipo === k).length;
    return `<button type="button" class="chip ${filtro === k ? 'on' : ''}" data-filtro-consulta="${k}">${esc(t)} <span class="n">${n}</span></button>`;
  }).join('');

  const visibles = filtro === 'todas' ? filas : filas.filter(f => f.tipo === filtro);
  const cuerpo = visibles.length ? visibles.map(f => {
    const t = TIPOS_CONSULTA[f.tipo] || { etiqueta: f.tipo, ayuda: '' };
    const sin = (f.filas_sin_comunidad > 0) ? `${fmtInt(f.filas_sin_comunidad)} filas · ${fmtMoney(f.gasto_sin_comunidad)}` : (f.filas_sin_comunidad === 0 ? '0' : '—');
    return `<tr>
      <td class="mono" style="white-space:nowrap">${esc(fmtFechaAR(f.ocurrio_en))}<div style="color:var(--text-faint);font-size:10px">${esc(haceCuantoConsulta(f.ocurrio_en))}</div></td>
      <td><span class="pill" title="${esc(t.ayuda)}">${esc(t.etiqueta)}</span></td>
      <td><span class="est ${claseEstado(f.estado)}">${esc(textoEstado(f.estado))}</span></td>
      <td>${esc(f.titulo)}</td>
      <td class="mono">${f.filas_origen == null ? '—' : fmtInt(f.filas_origen)}</td>
      <td class="mono">${f.filas_asignadas == null ? '—' : fmtInt(f.filas_asignadas)}</td>
      <td class="mono">${f.registros_escritos == null ? '—' : fmtInt(f.registros_escritos)}</td>
      <td class="mono">${esc(sin)}</td>
      <td style="max-width:420px;word-break:break-word;color:var(--text-muted)">${esc(f.detalle || '')}</td>
    </tr>`;
  }).join('') : `<tr class="empty-row"><td colspan="9">Sin registros para este filtro.</td></tr>`;

  return `${resumen}
    <div class="chips" style="margin-bottom:10px">${chips}</div>
    <div class="tbl-wrap"><table><thead><tr>
      <th>Fecha y hora (Argentina)</th><th>Tipo</th><th>Estado</th><th>Qué pasó</th>
      <th>Filas</th><th>Asignadas a comunidad</th><th>Registros escritos</th><th>Sin comunidad</th><th>Detalle</th>
    </tr></thead><tbody>${cuerpo}</tbody></table></div>
    <div class="sub" style="margin-top:12px">Se muestran las últimas ${fmtInt(filas.length)} líneas. Esta vista registra lo que llega a la base: lo que Windsor escribe, las conversiones, el trabajo programado y las importaciones por CSV.
      No incluye las llamadas internas de Windsor a Meta ni los intentos que no llegan a escribir en la base: esos se ven en el panel de Windsor.</div>`;
}

function cerrarConsultasWindsor(){
  const m = document.getElementById('modalConsultas');
  if (m) m.remove();
  document.body.style.overflow = '';
  if (window.__consultasEsc) { document.removeEventListener('keydown', window.__consultasEsc); window.__consultasEsc = null; }
}

async function abrirConsultasWindsor(){
  cerrarConsultasWindsor();
  const cont = document.createElement('div');
  cont.id = 'modalConsultas';
  cont.className = 'modal-full';
  cont.setAttribute('role', 'dialog');
  cont.setAttribute('aria-modal', 'true');
  cont.setAttribute('aria-label', 'Consultas a Windsor');
  cont.innerHTML = `<div class="modal-full-head">
      <div><h2>Consultas a Windsor</h2><div class="sub">Trazabilidad de los datos de Meta Ads: qué llegó, cuándo y qué se hizo con eso</div></div>
      <div class="modal-full-acciones">
        <button type="button" class="btn" id="btnConsultasActualizar">Actualizar</button>
        <button type="button" class="btn" id="btnConsultasCerrar">Cerrar ✕</button>
      </div>
    </div>
    <div class="modal-full-cuerpo" id="cuerpoConsultas">Cargando…</div>`;
  document.body.appendChild(cont);
  document.body.style.overflow = 'hidden';

  let filas = [], filtro = 'todas';
  const pintar = () => {
    const cuerpo = document.getElementById('cuerpoConsultas');
    if (!cuerpo) return;
    cuerpo.innerHTML = renderConsultasWindsor(filas, filtro);
    cuerpo.querySelectorAll('[data-filtro-consulta]').forEach(b => { b.onclick = () => { filtro = b.dataset.filtroConsulta; pintar(); }; });
  };
  const cargar = async () => {
    const cuerpo = document.getElementById('cuerpoConsultas');
    if (!cuerpo) return;
    try {
      const { data, error } = await supabase.rpc('consultas_windsor', { p_limite: 500 });
      if (error) throw error;
      filas = data || [];
      pintar();
    } catch (err) {
      cuerpo.innerHTML = `<span style="color:var(--danger)">No se pudieron cargar las consultas: ${esc(err.message)}</span>`;
    }
  };
  document.getElementById('btnConsultasCerrar').onclick = cerrarConsultasWindsor;
  document.getElementById('btnConsultasActualizar').onclick = cargar;
  window.__consultasEsc = (ev) => { if (ev.key === 'Escape') cerrarConsultasWindsor(); };
  document.addEventListener('keydown', window.__consultasEsc);
  await cargar();
}


/* CARGA-MIEMBROS:INICIO */
// Lector de la lista de miembros de un grupo: cada fila trae FECHA y TELÉFONO (y, para cargar varias comunidades de una vez, COMUNIDAD).
// La fecha es la de ingreso al grupo si se conoce, o la del registro; si falta, el servidor usa la de hoy. Acepta CSV o texto pegado,
// con o sin encabezado, en cualquier orden de columnas.
// Teléfonos: con o sin "+", espacios o guiones. Si falta el código de país se asume Argentina (11 5555-1234 → 5491155551234).
// Fechas: AAAA-MM-DD, DD/MM/AAAA, DD-MM-AAAA o DD/MM/AA (día primero), con hora opcional.
function normalizarTelefono(texto){
  let d = String(texto ?? '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  let completado = false;
  if (d.length === 10) { d = '549' + d; completado = true; }
  else if (d.length === 12 && d.startsWith('54') && d[2] !== '9') { d = '549' + d.slice(2); completado = true; }
  if (d.length < 10 || d.length > 15) return null;
  return { numero: d, completado };
}
function normalizarFecha(texto){
  const s = String(texto ?? '').trim();
  let a, m, d;
  let r = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?!\d)/);
  if (r) { a = +r[1]; m = +r[2]; d = +r[3]; }
  else {
    r = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2}|\d{4})(?!\d)/);
    if (!r) return null;
    d = +r[1]; m = +r[2]; a = +r[3]; if (r[3].length === 2) a += 2000;
  }
  const f = new Date(Date.UTC(a, m - 1, d));
  if (f.getUTCFullYear() !== a || f.getUTCMonth() !== m - 1 || f.getUTCDate() !== d) return null;
  return f.toISOString().slice(0, 10);
}
function partirLineaCsv(linea, sep){
  const out = []; let cel = '', entre = false;
  for (let i = 0; i < linea.length; i++) {
    const c = linea[i];
    if (entre) { if (c === '"') { if (linea[i + 1] === '"') { cel += '"'; i++; } else entre = false; } else cel += c; }
    else if (c === '"') entre = true;
    else if (c === sep) { out.push(cel); cel = ''; }
    else cel += c;
  }
  out.push(cel);
  return out.map(x => x.trim());
}
// Devuelve filas únicas [{ f: 'AAAA-MM-DD' | null, t: '549…', c?: 'comunidad' }] más los conteos. La propiedad c existe solo si el archivo
// trae una columna Comunidad (o Hoja, Localidad, Barrio). Un número repetido (en la misma comunidad) cuenta una vez, con su fecha más antigua.
function parsearListaMiembros(texto){
  const lineas = String(texto ?? '').replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim() !== '');
  const resultado = { filas_leidas: 0, filas: [], repetidos: 0, invalidos: 0, completados: 0, sin_fecha: 0, encabezado: false, tiene_comunidad: false };
  if (!lineas.length) return resultado;
  const cuenta = (c) => lineas[0].split(c).length - 1;
  const sep = [',', ';', '\t'].sort((a, b) => cuenta(b) - cuenta(a))[0];
  const filas = lineas.map(l => partirLineaCsv(l, sep));
  const tieneDato = (celdas) => celdas.some(c => normalizarFecha(c) || normalizarTelefono(c));
  let colTel = -1, colFecha = -1, colCom = -1, desde = 0;
  if (!tieneDato(filas[0])) {
    resultado.encabezado = true; desde = 1;
    colTel = filas[0].findIndex(h => /tel|phone|cel|n[uú]mero|numero|whats|\bwa\b/i.test(h));
    colFecha = filas[0].findIndex(h => /fecha|date|ingreso|d[ií]a/i.test(h));
    colCom = filas[0].findIndex(h => /comunidad|hoja|localidad|barrio/i.test(h));
    resultado.tiene_comunidad = colCom >= 0;
  }
  const porClave = new Map();
  for (let i = desde; i < filas.length; i++) {
    const celdas = filas[i];
    if (celdas.every(c => c === '')) continue;
    resultado.filas_leidas++;
    let n = null, f = null;
    if (colTel >= 0) n = normalizarTelefono(celdas[colTel]);
    else for (let k = 0; k < celdas.length && !n; k++) if (!normalizarFecha(celdas[k])) n = normalizarTelefono(celdas[k]);
    if (!n) { resultado.invalidos++; continue; }
    if (colFecha >= 0) f = normalizarFecha(celdas[colFecha]);
    else for (const c of celdas) { f = normalizarFecha(c); if (f) break; }
    const com = colCom >= 0 ? (celdas[colCom] || '').trim() : undefined;
    if (n.completado) resultado.completados++;
    if (!f) resultado.sin_fecha++;
    const clave = (com ?? '') + '|' + n.numero;
    const previo = porClave.get(clave);
    if (previo) {
      resultado.repetidos++;
      if (f && (!previo.f || f < previo.f)) previo.f = f;
    } else porClave.set(clave, com === undefined ? { f, t: n.numero } : { f, t: n.numero, c: com });
  }
  resultado.filas = [...porClave.values()];
  return resultado;
}
const normNombreCom = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
// Busca una comunidad por el nombre que trae el archivo (sin importar mayúsculas ni tildes). Si no hay coincidencia exacta, acepta una única
// comunidad cuyo nombre esté contenido en el del archivo o al revés (por ejemplo "Cortado Palermo" → Palermo).
function buscarComunidadPorNombre(nombre, comunidades){
  const n = normNombreCom(nombre);
  if (!n) return null;
  const exacta = comunidades.filter(c => normNombreCom(c.nombre) === n);
  if (exacta.length === 1) return exacta[0];
  const parcial = comunidades.filter(c => { const k = normNombreCom(c.nombre); return k && (n.includes(k) || k.includes(n)); });
  return parcial.length === 1 ? parcial[0] : null;
}
// Reparte las filas por comunidad. idSeleccionada = una comunidad (las filas con otra comunidad en el archivo se ignoran y se cuentan) o
// null = "todas" (cada fila va a la comunidad que dice el archivo; las que no se reconocen quedan afuera y se listan).
function repartirPorComunidad(filas, comunidades, idSeleccionada){
  const grupos = new Map(), desconocidas = new Map();
  let ajenas = 0, sinComunidad = 0;
  const sel = idSeleccionada ? comunidades.find(c => c.id === idSeleccionada) : null;
  for (const fila of filas) {
    let com = null;
    const tieneNombre = fila.c !== undefined && fila.c !== '';
    if (sel) {
      if (tieneNombre) { const m = buscarComunidadPorNombre(fila.c, comunidades); if (!m || m.id !== sel.id) { ajenas++; continue; } }
      com = sel;
    } else {
      if (!tieneNombre) { sinComunidad++; continue; }
      com = buscarComunidadPorNombre(fila.c, comunidades);
      if (!com) { desconocidas.set(fila.c, (desconocidas.get(fila.c) || 0) + 1); continue; }
    }
    if (!grupos.has(com.id)) grupos.set(com.id, { comunidad: com, filas: [] });
    grupos.get(com.id).filas.push({ f: fila.f, t: fila.t });
  }
  return { grupos: [...grupos.values()], desconocidas: [...desconocidas].map(([nombre, n]) => ({ nombre, n })), ajenas, sin_comunidad: sinComunidad };
}

}

        msg(`${hechas.length ? `<div style="color:#5fd39a">Ya guardadas: ${esc(hechas.join('; '))}.</div>` : ''}${rojo('Se detuvo en ' + g.comunidad.nombre + ': ' + errorClave(error))}<div class="sub">Sin guardar: ${esc(pendientes)}. Corregí y volvé a tocar Vista previa (lo ya guardado se mostrará como duplicado).</div>`);
        vistas = null; leido = null; return;
      }
      const r = (data && data[0]) || {};
      hechas.push(`${g.comunidad.nombre}: ${fmtInt(r.activos)} miembros (${fmtInt(r.nuevos)} nuevos${r.reingresos ? ', ' + fmtInt(r.reingresos) + ' vuelven' : ''}${r.salidas ? ', ' + fmtInt(r.salidas) + ' salidas' : ''})`);
    }
    vistas = null; leido = null;
    msg(`<span style="color:#5fd39a">Listo. ${hechas.map(esc).join(' · ')}. Quedó registrado en Consultas.</span>`);
  };
  el('cmVer').onclick = async () => {
    const { clave } = credenciales();
    if (!clave) return msg(rojo('Ingresá la clave de carga.'));
    if (esTodas()) return msg(rojo('Elegí una comunidad para ver sus miembros.'));
    el('cmMiembros').innerHTML = '<div class="sub">Cargando…</div>';
    const { data, error } = await supabase.rpc('ver_miembros_grupo', { p_clave: clave, p_comunidad: el('cmCom').value });
    if (error) { el('cmMiembros').innerHTML = ''; return msg(rojo(errorClave(error))); }
    const filas = data || [];
    if (!filas.length) { el('cmMiembros').innerHTML = '<div class="card"><div class="sub">Este grupo todavía no tiene ninguna carga.</div></div>'; return; }
    const activos = filas.filter(f => !f.salio_en).length;
    const entraron = filas.filter(f => !f.salio_en && f.entro_por_flow).length;
    const vacio = '<span style="display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;border:1px dashed var(--border-strong);color:var(--text-muted)">Sin dato</span>';
    el('cmMiembros').innerHTML = `<div class="card"><h3>Miembros del grupo: ${fmtInt(activos)} en el grupo${filas.length > activos ? ' · ' + fmtInt(filas.length - activos) + ' salieron' : ''}</h3>
      <div class="sub">${fmtInt(entraron)} de los que siguen entraron por el flow de ManyChat. El nombre aparece solo si la persona pasó por el flow.</div>
      <div class="tbl-wrap"><table><thead><tr><th>Teléfono</th><th>Fecha</th><th>Estado</th><th>Nombre (del CRM)</th><th>¿Entró por el flow?</th><th>Primera entrada</th></tr></thead><tbody>
        ${filas.map(f => `<tr><td class="mono">+${esc(f.telefono_id)}</td><td class="mono">${fmtDia(f.fecha)}</td><td>${f.salio_en ? 'Salió el ' + fmtDia(f.salio_en) : 'En el grupo'}</td><td>${f.nombre ? esc(f.nombre) : vacio}</td><td>${f.entro_por_flow ? 'Sí' : 'No'}</td><td class="mono">${f.primera_entrada ? esc(fmtFechaAR(f.primera_entrada)) : '—'}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  };
  el('btnCargaCerrar').onclick = cerrarCargaMiembros;
  window.__cargaEsc = (ev) => { if (ev.key === 'Escape') cerrarCargaMiembros(); };
  document.addEventListener('keydown', window.__cargaEsc);
}

function haceCuanto(v){
  const s = Math.max(0, Math.round((Date.now() - new Date(v).getTime()) / 1000));
  if (s < 60) return 'hace ' + s + ' s';
  if (s < 3600) return 'hace ' + Math.floor(s/60) + ' min';
  if (s < 86400) return 'hace ' + Math.floor(s/3600) + ' h';
  return 'hace ' + Math.floor(s/86400) + ' d';
}

/* ---------- Exportar CSV de Data_Cruda: toda la historia del cliente, no solo las 200 filas visibles ---------- */
const COLUMNAS_CSV = ['fecha_hora_ar','fecha_hora_utc','resultado','codigo_http','canal','contacto','usuario_instagram','nombre','comunidad','comunidad_enviada','mensaje_de_la_persona','motivo_rechazo','payload_json'];
const fechaAr = v => v ? new Date(v).toLocaleString('sv-SE', { timeZone:'America/Argentina/Buenos_Aires' }) : '';
// Toda celda va entre comillas. Si empieza con = + - @ (o tab/CR) se antepone ' para que Excel no la ejecute como fórmula
// (los nombres de perfil los escribe cualquiera).
function celdaCsv(v){
  let s = v === null || v === undefined ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
// Un teléfono (solo dígitos) va como ="…" para que Excel lo muestre completo y no como 5,49E+12.
const celdaContacto = id => /^\d{8,}$/.test(String(id ?? '')) ? '="' + id + '"' : celdaCsv(id);
function construirCsv(eventos, intentos, comunidadesById, sep){
  const items = [
    ...eventos.map(e => {
      const p = e.payload || {}, c = p.contact || {};
      const nombre = c.name || [c.first_name, c.last_name].filter(Boolean).join(' ') || '';
      return { t: new Date(e.recibido_en).getTime(), celdas: [
        celdaCsv(fechaAr(e.recibido_en)), celdaCsv(e.recibido_en), celdaCsv('Aceptado'), celdaCsv(200),
        celdaCsv(esInstagram(e.telefono_id) ? 'Instagram' : 'WhatsApp'), celdaContacto(e.telefono_id), celdaCsv(c.ig_username),
        celdaCsv(nombre), celdaCsv(comunidadesById.get(e.comunidad_id)), celdaCsv(p.community_id),
        celdaCsv(c.last_input_text), celdaCsv(''), celdaCsv(JSON.stringify(p)),
      ] };
    }),
    ...intentos.map(i => {
      const p = i.payload || null, c = (p && p.contact) || {};
      return { t: new Date(i.creado_en).getTime(), celdas: [
        celdaCsv(fechaAr(i.creado_en)), celdaCsv(i.creado_en), celdaCsv('Rechazado'), celdaCsv(i.estado),
        celdaCsv(i.telefono_id ? (esInstagram(i.telefono_id) ? 'Instagram' : 'WhatsApp') : ''), celdaContacto(i.telefono_id), celdaCsv(c.ig_username),
        celdaCsv(nombreDePayload(p)), celdaCsv(''), celdaCsv(i.comunidad_recibida), celdaCsv(c.last_input_text), celdaCsv(i.motivo),
        celdaCsv(p ? JSON.stringify(p) : ''),
      ] };
    }),
  ].sort((a, b) => b.t - a.t);
  return [COLUMNAS_CSV.map(celdaCsv).join(sep), ...items.map(x => x.celdas.join(sep))].join('\r\n') + '\r\n';
}
// Trae todas las filas del cliente de a 1000 (el máximo por consulta). El orden secundario por id evita saltear o repetir filas entre páginas.
async function traerTodo(tabla, columnaFecha){
  const filas = [], PAG = 1000;
  for (let desde = 0; desde < 200000; desde += PAG) {
    const { data, error } = await supabase.from(tabla).select('*').eq('cliente_id', state.clienteId)
      .order(columnaFecha, { ascending:false }).order('id', { ascending:false }).range(desde, desde + PAG - 1);
    if (error) throw error;
    filas.push(...(data || []));
    if (!data || data.length < PAG) break;
  }
  return filas;
}
function estadoExport(texto){ const el = document.getElementById('crudoExportEstado'); if (el) el.textContent = texto; }
async function exportarCsvCrudo(){
  if (state.exportando) return;
  state.exportando = true;
  const btn = document.getElementById('crudoExport');
  if (btn) btn.disabled = true;
  estadoExport('Exportando…');
  try {
    const sep = state.crudoSep || ';';
    const [eventos, intentos, comunidades] = await Promise.all([
      traerTodo('evento_crudo', 'recibido_en'),
      traerTodo('webhook_intento', 'creado_en').catch(() => []),
      loadComunidades(),
    ]);
    const csv = construirCsv(eventos, intentos, new Map(comunidades.map(c => [c.id, c.nombre])), sep);
    const cliente = state.clientes.find(c => c.id === state.clienteId);
    const nombre = `data_cruda_${cliente ? cliente.slug : 'cliente'}_${fechaAr(new Date()).slice(0, 10)}.csv`;
    const url = URL.createObjectURL(new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    estadoExport(`Listo: ${eventos.length + intentos.length} filas (${eventos.length} aceptados, ${intentos.length} rechazados) → ${nombre}`);
  } catch (err) {
    estadoExport('Error al exportar: ' + err.message);
  } finally {
    state.exportando = false;
    const b = document.getElementById('crudoExport');
    if (b) b.disabled = false;
  }
}

let crudoTimer = null;
// El refresco automático se salta mientras hay una exportación en curso.
const refrescarCrudo = () => { if (!state.exportando) renderAll(); };
function wireCrudo(){
  document.querySelectorAll('[data-crudo-filtro]').forEach(b => {
    b.onclick = () => { state.crudoFiltro = b.dataset.crudoFiltro; renderAll(); };
  });
  document.getElementById('crudoRefresh').onclick = () => renderAll();
  document.getElementById('crudoExport').onclick = exportarCsvCrudo;
  const sepSel = document.getElementById('crudoSep');
  sepSel.value = state.crudoSep || ';';
  sepSel.onchange = () => { state.crudoSep = sepSel.value; };
  const auto = document.getElementById('crudoAuto');
  auto.checked = !!state.crudoAuto;
  auto.onchange = () => { state.crudoAuto = auto.checked; if (auto.checked) crudoTimer = setInterval(refrescarCrudo, 30000); else clearInterval(crudoTimer); };
  if (state.crudoAuto) crudoTimer = setInterval(refrescarCrudo, 30000);
}

/* ---------- render principal ---------- */
async function renderAll(){
  clearInterval(crudoTimer);
  renderNav();
  document.getElementById('hTitle').textContent = TABS.find(t => t.key===state.tab).label;
  document.getElementById('hSub').textContent = TAB_SUB[state.tab];
  const content = document.getElementById('content');
  content.innerHTML = '<div class="card"><h3>Cargando…</h3></div>';

  if (!state.clienteId) {
    content.innerHTML = '<div class="card"><h3>Sin clientes cargados</h3><div class="sub">Dar de alta al menos un cliente en crm_comunidades_v2.cliente — ver docs/how-to/agregar-un-cliente.md.</div></div>';
    return;
  }

  try {
    if (state.tab === 'overview') {
      const [kpis, comunidades] = await Promise.all([loadKpisMacro(), loadComunidadesPerformance()]);
      content.innerHTML = renderOverview(kpis, comunidades);
      wireComunidadesForm();

    } else if (state.tab === 'control') {
      const comunidades = await loadComunidadesRango(state.fechaDesde || null, state.fechaHasta || null);
      content.innerHTML = renderControl(comunidades, state.filtroComunidad || null, state.fechaDesde || '', state.fechaHasta || '');
      wireControl();

    } else if (state.tab === 'atribucion') {
      content.innerHTML = renderAtribucion();

    } else if (state.tab === 'base_limpia') {
      state.baseLimpiaFiltro = state.baseLimpiaFiltro || { comunidad:null, busqueda:'', pagina:1 };
      const [usuarios, comunidades] = await Promise.all([loadBaseLimpia(), loadComunidadesPerformance()]);
      content.innerHTML = renderBaseLimpia(usuarios, comunidades, state.baseLimpiaFiltro);
      wireBaseLimpia();

    } else if (state.tab === 'dedup') {
      const [eventos, comunidades] = await Promise.all([loadEventoDeduplicado(), loadComunidades()]);
      const byId = new Map(comunidades.map(c => [c.id, c.nombre]));
      content.innerHTML = renderDedup(eventos, byId);

    } else if (state.tab === 'crudo') {
      const [eventos, intentos, comunidades] = await Promise.all([loadEventoCrudo(), loadIntentosRechazados(), loadComunidades()]);
      const byId = new Map(comunidades.map(c => [c.id, c.nombre]));
      content.innerHTML = renderCrudo(eventos, intentos, byId, state.crudoFiltro || 'todos');
      wireCrudo();
    }
  } catch (err) {
    content.innerHTML = `<div class="card"><h3>Error consultando Supabase</h3><div class="sub" style="color:var(--danger)">${esc(err.message)}</div></div>`;
  }
}

/* ---------- sin login (temporal, ver README) ---------- */
const configError = document.getElementById('configError');
if (!supabase) {
  configError.style.display = 'block';
  configError.innerHTML = '<h3 style="color:var(--danger)">Config no disponible</h3><div class="sub">Falta SUPABASE_URL/SUPABASE_ANON_KEY (variables de entorno de Vercel).</div>';
} else {
  iniciar();
}

async function iniciar(){
  try {
    const { data, error } = await supabase.from('cliente').select('id, nombre, slug').eq('activo', true).order('nombre');
    if (error) throw error;
    state.clientes = data || [];
  } catch (err) {
    configError.style.display = 'block';
    configError.innerHTML = `<h3 style="color:var(--danger)">No se pudo cargar la lista de clientes</h3><div class="sub" style="color:var(--danger)">${esc(err.message)}</div>`;
    return;
  }
  const guardado = leerClienteGuardado();
  state.clienteId = (state.clientes.find(c => c.id === guardado) || state.clientes[0] || {}).id || null;
  renderSelectorCliente();
  enterApp();
}
</script>
